<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2005" role="img" aria-labelledby="title desc"><title id="title">Preparación administrativa de un restaurante desde cero</title><desc id="desc">Orden recomendado y decisiones: Inventario, local, sala, cocina, turnos, carta o menú, extras, borrador, revisión, bloqueos y aplicación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#687587"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#1d3557}.title{font-size:23px;font-weight:700}.detail{font-size:17px;fill:#424b57}.edge{fill:none;stroke:#687587;stroke-width:2.5}.edge-label{font-size:15px;fill:#384c62;font-weight:bold}.process{fill:#fff;stroke:#b4bcc7;stroke-width:1.5}.decision{fill:#e9eff7;stroke:#1d3557;stroke-width:2}.note{fill:#f8f2e8;stroke:#b49b6a;stroke-width:1.5}.end{fill:#e7f2ec;stroke:#4b7867;stroke-width:2}</style><rect width="1440" height="2005" fill="#f7f5f2"/><path d="M720,140 L720,180" class="edge" marker-end="url(#arrow)"/><path d="M720,280 L720,330" class="edge" marker-end="url(#arrow)"/><text x="728" y="298" class="edge-label">Sí</text><path d="M720,420 L720,450" class="edge" marker-end="url(#arrow)"/><path d="M720,540 L720,570" class="edge" marker-end="url(#arrow)"/><path d="M720,660 L720,690" class="edge" marker-end="url(#arrow)"/><path d="M720,780 L720,810" class="edge" marker-end="url(#arrow)"/><path d="M720,905 L365,955" class="edge" marker-end="url(#arrow)"/><text x="550.5" y="923" class="edge-label">Carta</text><path d="M720,905 L1085,955" class="edge" marker-end="url(#arrow)"/><text x="910.5" y="923" class="edge-label">Menú</text><path d="M365,1075 L720,1135" class="edge" marker-end="url(#arrow)"/><path d="M1085,1075 L720,1135" class="edge" marker-end="url(#arrow)"/><path d="M720,1240 L720,1275" class="edge" marker-end="url(#arrow)"/><path d="M720,1365 L720,1405" class="edge" marker-end="url(#arrow)"/><path d="M720,1510 L720,1550" class="edge" marker-end="url(#arrow)"/><text x="728" y="1523" class="edge-label">Sin errores</text><path d="M720,1645 L720,1700" class="edge" marker-end="url(#arrow)"/><text x="728" y="1665.5" class="edge-label">No</text><path d="M720,1790 L720,1825" class="edge" marker-end="url(#arrow)"/><text x="728" y="1800.5" class="edge-label">Éxito</text><path d="M470,230 L390,257.5" class="edge" marker-end="url(#arrow)"/><text x="438" y="236.75" class="edge-label">No</text><path d="M205,340 L205,357.5 L470,357.5 L470,375" class="edge" marker-end="url(#arrow)"/><text x="345.5" y="350.5" class="edge-label">Preparado</text><path d="M470,1457.5 L390,1460" class="edge" marker-end="url(#arrow)"/><text x="438" y="1451.75" class="edge-label">Atención</text><path d="M970,1597.5 L1035,1595" class="edge" marker-end="url(#arrow)"/><text x="1010.5" y="1589.25" class="edge-label">Sí</text><path d="M470,1745 L390,1727.5" class="edge" marker-end="url(#arrow)"/><text x="438" y="1729.25" class="edge-label">Fallo</text><path d="M20,1460 L8,1460 L8,1320 L470,1320" class="edge" marker-end="url(#arrow)"/><path d="M1415,1590 L1430,1590 L1430,1375 L720,1375 L720,1405" class="edge" marker-end="url(#arrow)"/><g id="company"><rect x="470" y="50" width="500" height="90" rx="12" class="process"/><text x="488" y="79" class="title">1 · Empresa y permisos</text><text x="488" y="104" class="detail">Inicie sesión y seleccione la empresa.</text><text x="488" y="127" class="detail">Confirme permiso de configuración.</text></g><g id="inventory"><rect x="470" y="180" width="500" height="100" rx="28" class="decision"/><text x="488" y="209" class="title">¿Existen los productos que venderá?</text><text x="488" y="234" class="detail">Distinga platos, bebidas e ingredientes.</text><text x="488" y="257" class="detail">Este catálogo usa productos de Inventario.</text></g><g id="prerequisites"><rect x="20" y="175" width="370" height="165" rx="12" class="note"/><text x="38" y="204" class="title">Si faltan → Inventario</text><text x="38" y="229" class="detail">Cree productos base fuera de Restaurantes.</text><text x="38" y="252" class="detail">Con receta: ingredientes y receta válidos.</text><text x="38" y="275" class="detail">Con consumo: bodega de la empresa.</text><text x="38" y="298" class="detail">No se graba esa preparación en esta entrega.</text></g><g id="restaurant"><rect x="470" y="330" width="500" height="90" rx="12" class="process"/><text x="488" y="359" class="title">2 · Información general</text><text x="488" y="384" class="detail">Nombre, código único y tipo de local.</text><text x="488" y="407" class="detail">Foto opcional; conserve el restaurante activo.</text></g><g id="floor"><rect x="470" y="450" width="500" height="90" rx="12" class="process"/><text x="488" y="479" class="title">3 · Sala y mesas</text><text x="488" y="504" class="detail">Cree áreas y añada o duplique mesas.</text><text x="488" y="527" class="detail">Defina capacidad y guarde el plano.</text></g><g id="kitchen"><rect x="470" y="570" width="500" height="90" rx="12" class="process"/><text x="488" y="599" class="title">4 · Cocina e impresión</text><text x="488" y="624" class="detail">Cree una cocina o bar activo.</text><text x="488" y="647" class="detail">Impresión opcional: clave y dispositivo listos.</text></g><g id="shift"><rect x="470" y="690" width="500" height="90" rx="12" class="process"/><text x="488" y="719" class="title">5 · Turnos del equipo</text><text x="488" y="744" class="detail">Inicio, fin y tolerancia de llegada.</text><text x="488" y="767" class="detail">Estos horarios son para registrar al personal.</text></g><g id="type"><rect x="470" y="810" width="500" height="95" rx="28" class="decision"/><text x="488" y="839" class="title">¿Qué va a ofrecer?</text><text x="488" y="864" class="detail">Puede preparar carta, menús o ambos.</text></g><g id="offers"><rect x="70" y="955" width="590" height="120" rx="12" class="process"/><text x="88" y="984" class="title">6A · Productos a la venta</text><text x="88" y="1009" class="detail">Seleccione varios productos existentes.</text><text x="88" y="1032" class="detail">Ajustes comunes: modalidad, cocina, consumo y precio.</text><text x="88" y="1055" class="detail">Precio de Inventario o precio propio; excepciones por fila.</text></g><g id="menu"><rect x="790" y="955" width="590" height="120" rx="12" class="process"/><text x="808" y="984" class="title">6B · Crear un menú completo</text><text x="808" y="1009" class="detail">Nombre, modalidad y precio base; seleccione por sección.</text><text x="808" y="1032" class="detail">2 entradas + 3 principales + 1 bebida: alternativas.</text><text x="808" y="1055" class="detail">Las ofertas faltantes se preparan dentro del borrador.</text></g><g id="extras"><rect x="470" y="1135" width="500" height="105" rx="12" class="process"/><text x="488" y="1164" class="title">7 · Opciones y extras (si los necesita)</text><text x="488" y="1189" class="detail">Edite el grupo con todas sus opciones y recargos.</text><text x="488" y="1212" class="detail">Mínimo/máximo; asigne a varios productos.</text><text x="488" y="1235" class="detail">Los cambios afectan todos los menús que los usan.</text></g><g id="save"><rect x="470" y="1275" width="500" height="90" rx="12" class="process"/><text x="488" y="1304" class="title">Guardar borrador</text><text x="488" y="1329" class="detail">Guarde y retome en otra sesión del equipo.</text><text x="488" y="1352" class="detail">Aún no cambia lo que se puede pedir.</text></g><g id="history"><rect x="1035" y="1135" width="380" height="160" rx="12" class="note"/><text x="1053" y="1164" class="title">Al preparar o reutilizar</text><text x="1053" y="1189" class="detail">Una oferta por producto y modalidad.</text><text x="1053" y="1212" class="detail">Menús y grupos se pueden duplicar.</text><text x="1053" y="1235" class="detail">Confirme límites antes de unificarlos.</text><text x="1053" y="1258" class="detail">“Incluido” no elimina recargos.</text></g><g id="review"><rect x="470" y="1405" width="500" height="105" rx="12" class="process"/><text x="488" y="1434" class="title">8 · Revisar y probar elecciones</text><text x="488" y="1459" class="detail">Revise campos, referencias y menús afectados.</text><text x="488" y="1482" class="detail">Ejemplo válido: $7 + $2 + $1,50 = $10,50.</text><text x="488" y="1505" class="detail">La vista previa no crea pedidos ni consume stock.</text></g><g id="errors"><rect x="20" y="1385" width="370" height="150" rx="12" class="note"/><text x="38" y="1414" class="title">Errores o conflicto</text><text x="38" y="1439" class="detail">Corrija el elemento y campo señalado.</text><text x="38" y="1462" class="detail">Compare versión local y la del equipo.</text><text x="38" y="1485" class="detail">Resuelva, guarde y vuelva a revisar.</text><text x="38" y="1508" class="detail">La edición local se conserva.</text></g><g id="service"><rect x="470" y="1550" width="500" height="95" rx="28" class="decision"/><text x="488" y="1579" class="title">¿Hay servicio activo?</text><text x="488" y="1604" class="detail">OPEN o PENDING_CLOSE impiden aplicar.</text></g><g id="attention"><rect x="1035" y="1500" width="380" height="190" rx="12" class="note"/><text x="1053" y="1529" class="title">Sí → conservar el borrador</text><text x="1053" y="1554" class="detail">Abra Atenciones activas.</text><text x="1053" y="1577" class="detail">Localice mesa o habitación y responsable.</text><text x="1053" y="1600" class="detail">Resuelva rondas, comandas y liquidación.</text><text x="1053" y="1623" class="detail">Cierre en el flujo operativo autorizado.</text><text x="1053" y="1646" class="detail">Regrese a revisar después del cierre.</text><text x="1053" y="1669" class="detail">No se aplica automáticamente.</text></g><g id="failure"><rect x="20" y="1660" width="370" height="135" rx="12" class="note"/><text x="38" y="1689" class="title">Si falla la aplicación</text><text x="38" y="1714" class="detail">El catálogo vigente queda intacto.</text><text x="38" y="1737" class="detail">Conserve el borrador y vuelva a revisar.</text><text x="38" y="1760" class="detail">Reintente después de resolver el fallo.</text></g><g id="apply"><rect x="470" y="1700" width="500" height="90" rx="12" class="process"/><text x="488" y="1729" class="title">9 · Aplicar catálogo completo</text><text x="488" y="1754" class="detail">Todo junto en una transacción.</text><text x="488" y="1777" class="detail">Un fallo conserva el catálogo vigente; reintente.</text></g><g id="ready"><rect x="470" y="1825" width="500" height="140" rx="12" class="end"/><text x="488" y="1854" class="title">Restaurante preparado para comenzar</text><text x="488" y="1879" class="detail">Verifique el resumen: local, sala, cocina, turno y oferta.</text><text x="488" y="1902" class="detail">El indicador no exige menús ni extras.</text><text x="488" y="1925" class="detail">Antes del servicio: ensaye pedidos y compruebe stock</text><text x="488" y="1948" class="detail">e impresión en un entorno de pruebas.</text></g><text x="470" y="1980" class="detail">Orden recomendado; el catálogo permite guardar trabajo incompleto en cualquier momento.</text></svg>